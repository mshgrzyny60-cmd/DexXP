name: 🐛 Bug Report
description: Report a bug or crash in DexXP
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide details on what happened and steps to reproduce.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      placeholder: "A clear and concise description of what the bug is."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Go to '...'\n2. Click on '...'\n3. See error"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android Version
      placeholder: "e.g. Xiaomi 11T / Android 14"
    validations:
      required: true
